# Spring Boot Application Configuration

# Application Name
spring.application.name=Leave Management System

# Server Configuration
server.port=8080
server.servlet.context-path=/lms

# Database Configuration - SQLite
# date_class=TEXT stores dates as readable text so SQL date functions (e.g. YEAR) work
spring.datasource.url=jdbc:sqlite:leavemanagement.db?date_class=TEXT
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Schema is managed by Flyway (db/migration); Hibernate must not change it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# sqlite-jdbc 3.43+ no longer supports JDBC getGeneratedKeys; Hibernate reads new IDs with last_insert_rowid() instead
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Logging Configuration
logging.level.root=INFO
logging.level.com.leavemanagement=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# API Documentation (Optional - for Swagger/Springdoc)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Application-specific properties
app.name=Leave Management System
app.version=1.0.0
app.description=A comprehensive leave management system for managing employee leaves

# Initial HR admin account, created on first start if no HR_ADMIN exists.
# Set LMS_ADMIN_PASSWORD in the environment; if it is not set, a random password is generated and logged once.
app.admin.username=${LMS_ADMIN_USERNAME:admin@lms.local}
app.admin.password=${LMS_ADMIN_PASSWORD:}

# JWT login. Set LMS_JWT_SECRET to a random string of 32+ characters to keep users logged in across restarts
# (without it a random key is used at each start). Tokens last 8 hours; logout or a password change cancels them.
# Set LMS_COOKIE_SECURE=true when the app is served over HTTPS.
app.jwt.secret=${LMS_JWT_SECRET:}
app.jwt.expiration-minutes=${LMS_JWT_EXPIRATION_MINUTES:480}
app.jwt.cookie-secure=${LMS_COOKIE_SECURE:false}

# Role names shown to users. The role codes are fixed; rename the Lab Head here (or set LMS_LAB_HEAD_NAME).
app.role-names.lab-head=${LMS_LAB_HEAD_NAME:Lab Head}

# Email (temporary passwords). The account's App password is never stored here: set LMS_MAIL_USERNAME and
# LMS_MAIL_PASSWORD on the computer that runs the app. Defaults suit Google mail (htic / brain.iitm.ac.in).
app.mail.host=${LMS_MAIL_HOST:smtp.gmail.com}
app.mail.port=${LMS_MAIL_PORT:587}
app.mail.username=${LMS_MAIL_USERNAME:}
app.mail.password=${LMS_MAIL_PASSWORD:}
app.mail.from=${LMS_MAIL_FROM:${LMS_MAIL_USERNAME:}}
# Monthly leave added to every active employee's shared balance on the 1st of each month (and on creation)
app.leave.monthly-days=${LMS_MONTHLY_LEAVE_DAYS:2.5}

# Shown in the email so the employee knows where to log in
app.login-url=${LMS_LOGIN_URL:http://localhost:8081/lms/login}

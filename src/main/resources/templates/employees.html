<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
    <title>Employee Management - Leave Management System</title>
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <!-- Main Content -->
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <div class="d-flex justify-content-between align-items-center">
                    <h1>Employee Management</h1>
                    <a class="btn btn-outline-success" th:href="@{/api/reports/employees/export}">Export to Excel</a>
                </div>
                <hr>
            </div>
        </div>

        <!-- Shown after a temporary password has been emailed (stays until dismissed); the password itself is never shown -->
        <div class="alert alert-success" id="sentNotice" hidden>
            <span id="sentNoticeText"></span>
            <button type="button" class="btn-close float-end" onclick="document.getElementById('sentNotice').hidden = true"></button>
        </div>

        <!-- Admin only: check the email sender before creating real employees -->
        <div class="card mb-4" id="mailCheck" hidden>
            <div class="card-header bg-light">
                <h6 class="mb-0">Email check (admin)</h6>
            </div>
            <div class="card-body">
                <p class="mb-2 small" id="mailStatus">Checking the email settings...</p>
                <div class="input-group" style="max-width: 560px">
                    <input type="email" class="form-control" id="testEmailTo" placeholder="Send a test email to (e.g. your office email)">
                    <button class="btn btn-outline-primary" type="button" id="testEmailBtn" onclick="sendTestEmail()">Send test email</button>
                </div>
            </div>
        </div>

        <!-- Add / Edit Employee Form -->
        <div class="row mb-4">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0" id="formTitle">Add New Employee</h5>
                        <button type="button" class="btn btn-light btn-sm" id="cancelEditBtn" hidden onclick="resetForm()">Cancel edit</button>
                    </div>
                    <div class="card-body">
                        <form id="employeeForm">
                            <input type="hidden" id="editEmployeeId">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="firstName" class="form-label">First Name</label>
                                    <input type="text" class="form-control" id="firstName" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="lastName" class="form-label">Last Name</label>
                                    <input type="text" class="form-control" id="lastName" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label">Email (used to log in)</label>
                                    <input type="email" class="form-control" id="email" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="phone" class="form-label">Mobile number</label>
                                    <input type="tel" class="form-control" id="phone" placeholder="e.g. +91 98765 43210">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="department" class="form-label">Department / Team</label>
                                    <input type="text" class="form-control" id="department" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="designation" class="form-label">Designation</label>
                                    <input type="text" class="form-control" id="designation" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="salary" class="form-label">Salary</label>
                                    <input type="number" class="form-control" id="salary" step="0.01" min="0.01" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="dateOfJoining" class="form-label">Date of Joining</label>
                                    <input type="date" class="form-control" id="dateOfJoining" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="role" class="form-label">Role</label>
                                    <select class="form-select" id="role" required>
                                        <option value="EMPLOYEE">Employee</option>
                                        <option value="TEAM_LEAD">Team Lead</option>
                                        <option value="HR_ADMIN">HR / Admin</option>
                                        <option value="LAB_HEAD" th:text="${roleNames['LAB_HEAD']}">Lab Head</option>
                                    </select>
                                </div>
                                <!-- HR staff: their leave goes to the Lab Head and, optionally, a Team Lead; either one approves -->
                                <div class="col-md-6 mb-3" id="headApproverGroup" hidden>
                                    <label for="headApprover" class="form-label"
                                           th:text="|${roleNames['LAB_HEAD']} (approves this HR employee's leave)|">Lab Head</label>
                                    <select class="form-select" id="headApprover">
                                        <option value="">Choose...</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="reportingLead" class="form-label" id="reportingLeadLabel">Reporting Lead</label>
                                    <select class="form-select" id="reportingLead">
                                        <option value="">None</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3" id="statusGroup" hidden>
                                    <label for="status" class="form-label">Status</label>
                                    <select class="form-select" id="status">
                                        <option value="ACTIVE">Active</option>
                                        <option value="INACTIVE">Inactive</option>
                                        <option value="RESIGNED">Resigned</option>
                                        <option value="RELIEVED">Relieved</option>
                                    </select>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success" id="submitBtn">Add Employee</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Search Employee -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">Search Employees</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="searchName" class="form-label">Search by Name</label>
                            <input type="text" class="form-control" id="searchName" placeholder="Enter employee name">
                        </div>
                        <button type="button" class="btn btn-info" onclick="searchEmployees()">Search</button>
                        <button type="button" class="btn btn-warning" onclick="loadAllEmployees()">Show All</button>
                        <div class="form-check mt-3">
                            <input class="form-check-input" type="checkbox" id="includeInactive" onchange="loadAllEmployees()">
                            <label class="form-check-label" for="includeInactive">Include inactive / resigned / relieved</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Employees List -->
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="mb-0">Employees List</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover" id="employeesTable">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>Email</th>
                                        <th>Mobile</th>
                                        <th>Department</th>
                                        <th>Designation</th>
                                        <th>Role</th>
                                        <th>Reporting Lead / Approvers</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="employeesList">
                                    <tr>
                                        <td colspan="10" class="text-center">Loading employees...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
    <script th:src="@{/js/employees.js}"></script>
</body>
</html>

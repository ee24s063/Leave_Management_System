<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <!-- Shared page head: CSRF token for JavaScript API calls, Bootstrap and app styles -->
    <th:block th:fragment="head">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
        <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </th:block>
</head>
<body>
    <!-- Navigation bar: links are shown according to the user's role -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">Leave Management System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav" sec:authorize="isAuthenticated()">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/profile}">My Profile</a></li>
                    <li class="nav-item" sec:authorize="hasAnyRole('HR_ADMIN', 'TEAM_LEAD')">
                        <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('HR_ADMIN')">
                        <a class="nav-link" th:href="@{/employees}">Employees</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/leave-requests}">Leave Requests</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/comp-off}">Comp-off</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/leave-balance}">Leave Balance</a></li>
                    <li class="nav-item">
                        <span class="navbar-text ms-lg-3 me-2 small">
                            <span sec:authentication="name"></span>
                            (<span sec:authorize="hasRole('HR_ADMIN')">HR</span><span sec:authorize="hasRole('TEAM_LEAD')">Team Lead</span><span sec:authorize="hasRole('EMPLOYEE')">Employee</span><span sec:authorize="hasRole('LAB_HEAD')" th:text="${roleNames != null ? roleNames['LAB_HEAD'] : 'Lab Head'}">Lab Head</span>)
                        </span>
                    </li>
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <footer th:fragment="footer" class="bg-dark text-white text-center p-4 mt-5">
        <p>&copy; 2026 Leave Management System. All rights reserved.</p>
    </footer>

    <th:block th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:inline="javascript">window.SERVER_ROLE_NAMES = /*[[${roleNames}]]*/ null;</script>
        <script th:src="@{/js/main.js}"></script>
    </th:block>
</body>
</html>
